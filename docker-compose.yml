networks:
  delivery_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:
  caddy_data:
  caddy_config:

services:
  api_gateway:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    container_name: delivery_api_gateway
    restart: always
    networks:
      - delivery_network
    ports:
      - '80:80'
      - '443:443'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-auth:4001}
      ORDERS_UPSTREAM: ${ORDERS_UPSTREAM:-orders:4002}
      GEO_UPSTREAM: ${GEO_UPSTREAM:-geolocation:4003}
      NOTIFICATIONS_UPSTREAM: ${NOTIFICATIONS_UPSTREAM:-notifications:4004}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:18-alpine
    container_name: delivery_postgres
    restart: always
    networks:
      - delivery_network
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dashroute}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-dashroute}']
      interval: 3s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.18.2
    container_name: delivery_migrator
    networks:
      - delivery_network
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-dashroute}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  cache:
    image: redis:8.10-alpine
    container_name: delivery_redis
    restart: always
    networks:
      - delivery_network
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5

  broker:
    image: rabbitmq:4.3-management-alpine
    container_name: delivery_rabbitmq
    restart: always
    networks:
      - delivery_network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  orders:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
      target: prod
    container_name: delivery_orders
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:4002/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - delivery_network
    environment:
      NODE_ENV: production
      PORT: 4002
      SERVICE_NAME: orders-service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dashroute}
      RABBITMQ_HOST: broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: prod
    container_name: delivery_auth
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:4001/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - delivery_network
    environment:
      NODE_ENV: production
      PORT: 4001
      SERVICE_NAME: auth-service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dashroute}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
      target: prod
    container_name: delivery_audit
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - delivery_network
    environment:
      NODE_ENV: production
      SERVICE_NAME: audit-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dashroute}
      RABBITMQ_HOST: broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
      target: prod
    container_name: delivery_notifications
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:4004/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - delivery_network
    environment:
      NODE_ENV: production
      PORT: 4004
      SERVICE_NAME: notifications-service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dashroute}
      RABBITMQ_HOST: broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy

  ai-ops:
    build:
      context: .
      dockerfile: services/ai-ops-service/Dockerfile
      target: prod
    container_name: delivery_ai_ops
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:4005/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - delivery_network
    environment:
      NODE_ENV: production
      PORT: 4005
      SERVICE_NAME: ai-ops-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      migrator:
        condition: service_completed_successfully

  dispatch:
    build:
      context: .
      dockerfile: services/dispatch-engine/Dockerfile
      target: prod
    container_name: delivery_dispatch
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - delivery_network
    environment:
      NODE_ENV: production
      REDIS_URL: redis://cache:6379/0
      RABBITMQ_HOST: broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      cache:
        condition: service_healthy
      broker:
        condition: service_healthy

  geolocation:
    build:
      context: .
      dockerfile: services/geolocation-service/Dockerfile
      target: prod
    container_name: delivery_geolocation
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:4003/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [backend, all]
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - delivery_network
    environment:
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://cache:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      cache:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      target: prod
    container_name: delivery_admin_web
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [web, all]
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - delivery_network
    ports:
      - '${ADMIN_WEB_PORT:-3001}:3000' # 3000 is taken by Grafana

  swagger_ui:
    image: swaggerapi/swagger-ui:latest
    container_name: delivery_swagger
    restart: always
    networks:
      - delivery_network
    environment:
      URLS: "[{ url: 'specs/dashroute-unified.openapi.yaml', name: 'DashRoute API (Unified Gateway)' }, { url: 'specs/dev/auth-service.openapi.yaml', name: '[DEV ONLY] Auth Service (:4001)' }, { url: 'specs/dev/orders-service.openapi.yaml', name: '[DEV ONLY] Orders Service (:4002)' }, { url: 'specs/dev/geolocation-service.openapi.yaml', name: '[DEV ONLY] Geolocation Service (:4003)' }]"
    volumes:
      - ./docs/api:/usr/share/nginx/html/specs:ro
    ports:
      - '${SWAGGER_PORT:-8080}:8080'

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: delivery_jaeger
    restart: always
    networks:
      - delivery_network
    ports:
      - '16686:16686'
      - '4317'

  loki:
    image: grafana/loki:3.1.0
    container_name: delivery_loki
    restart: always
    networks:
      - delivery_network
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    ports:
      - '3100:3100'

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: delivery_prometheus
    restart: always
    networks:
      - delivery_network
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: delivery_otel_collector
    restart: always
    networks:
      - delivery_network
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infra/observability/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      - jaeger
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: delivery_grafana
    restart: always
    networks:
      - delivery_network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - jaeger
