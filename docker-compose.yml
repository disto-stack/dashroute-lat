networks:
  delivery_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:

services:
  postgres:
    image: postgres:18-alpine
    container_name: delivery_postgres
    restart: always
    networks:
      - delivery_network
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dashroute}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-dashroute}']
      interval: 3s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.18.2
    container_name: delivery_migrator
    networks:
      - delivery_network
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-dashroute}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  cache:
    image: redis:8.10-alpine
    container_name: delivery_redis
    restart: always
    networks:
      - delivery_network
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5

  broker:
    image: rabbitmq:4.3-management-alpine
    container_name: delivery_rabbitmq
    restart: always
    networks:
      - delivery_network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  swagger_ui:
    image: swaggerapi/swagger-ui:latest
    container_name: delivery_swagger
    restart: always
    networks:
      - delivery_network
    environment:
      URLS: "[{ url: 'specs/dashroute-unified.openapi.yaml', name: '🌟 DashRoute API (Unified Gateway)' }, { url: 'specs/dev/auth-service.openapi.yaml', name: '🛠️ [DEV ONLY] Auth Service (:4001)' }, { url: 'specs/dev/orders-service.openapi.yaml', name: '📦 [DEV ONLY] Orders Service (:4002)' }, { url: 'specs/dev/geolocation-service.openapi.yaml', name: '📍 [DEV ONLY] Geolocation Service (:4003)' }]"
    volumes:
      - ./docs/api:/usr/share/nginx/html/specs:ro
    ports:
      - '${SWAGGER_PORT:-8080}:8080'

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: delivery_jaeger
    restart: always
    networks:
      - delivery_network
    ports:
      - '16686:16686'
      - '4317'

  loki:
    image: grafana/loki:3.1.0
    container_name: delivery_loki
    restart: always
    networks:
      - delivery_network
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    ports:
      - '3100:3100'

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: delivery_prometheus
    restart: always
    networks:
      - delivery_network
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: delivery_otel_collector
    restart: always
    networks:
      - delivery_network
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infra/observability/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      - jaeger
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: delivery_grafana
    restart: always
    networks:
      - delivery_network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - jaeger
