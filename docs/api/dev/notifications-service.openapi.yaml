openapi: 3.2.0
info:
  title: "[DEV ONLY] Notifications Service"
  version: 1.0.0
  description: >
    Standalone dev OpenAPI spec for the Notifications service.
    Note: For the unified gateway view, check the DashRoute API (Unified Gateway) spec.
servers:
  - url: http://localhost:4004
    description: Local development server

paths:
  /health:
    get:
      summary: Service Health Check
      responses:
        '200':
          description: Service is healthy.

  /devices/register-token:
    post:
      summary: Register Device Push Token
      description: Registers or updates an Expo push token for the authenticated user (`user_id`).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expoPushToken
              properties:
                expoPushToken:
                  type: string
                  example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
      responses:
        '200':
          description: Push token registered or updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error or missing expoPushToken.
        '401':
          description: Missing or invalid JWT.

  /devices/ws:
    get:
      summary: Notifications WebSocket Connection
      description: >
        **NOTE: This is a WebSocket (ws://) endpoint, not a standard REST HTTP endpoint.**
        
        Initiates a persistent WebSocket connection for real-time driver notifications (e.g. `mission.assigned`). Requires JWT via `token` query param or `Authorization: Bearer <token>` header.
      security:
        - BearerAuth: []
      responses:
        '101':
          description: Switching Protocols to WebSocket.
        '401':
          description: Unauthorized access token.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
