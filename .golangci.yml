run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive

linters-settings:
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: true
  gofmt:
    simplify: true

issues:
  exclude-dirs:
    - node_modules
    - dist
    - bin
